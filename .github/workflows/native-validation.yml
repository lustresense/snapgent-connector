name: Native validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension regression tests
        shell: pwsh
        run: |
          Get-ChildItem snapgent-extension -Filter 'test-*.js' | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($_.Name)" }
          }
      - name: Native tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - name: Release build
        run: cargo build --release --locked --manifest-path rust/Cargo.toml -p snapgent
